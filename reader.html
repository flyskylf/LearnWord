<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reader">
    <title>Reader</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #000;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* File Upload Interface */
        #upload-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: #1c1c1e;
            text-align: center;
        }

        .upload-card {
            border: 2px dashed #444;
            border-radius: 24px;
            padding: 40px 30px;
            width: 85%;
            max-width: 420px;
            background: rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .upload-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .upload-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .upload-subtitle {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-select {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        #viewport {
            position: fixed;
            inset: 0;
            display: none;
            overflow: hidden;
            background: #000;
        }

        :root {
            --stage-width: 960px;
            --stage-height: 540px;
        }

        #stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--stage-width);
            height: var(--stage-height);
            transform-origin: center center;
            background: #fff;
            overflow: hidden;
        }

        #book-img {
            position: absolute;
            display: block;
            border: 0;
            outline: 0;
            max-width: none;
            max-height: none;
        }

        .nav-btn {
            position: absolute;
            width: 60px;
            height: 70px;
            padding: 0;
            margin: 0;
            background: rgba(120,120,120,.65);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 32px;
            font-weight: 700;
            line-height: 70px;
            text-align: center;
            z-index: 200;
            cursor: pointer;
        }

        #prev-btn {
            left: 15px;
            top: 235px;
        }

        #next-btn {
            right: 15px;
            top: 235px;
        }

        .nav-btn:disabled {
            display: none;
        }

        /* Top-left Back Button */
        #back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            padding: 0;
            margin: 0;
            background: rgba(0,0,0,.25);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 20px;
            z-index: 300;
            cursor: pointer;
        }

        /* Bottom-left Setting Button */
        #settings-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            padding: 0;
            margin: 0;
            background: rgba(0,0,0,.35);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 22px;
            z-index: 300;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #settings-btn:active {
            transform: scale(0.95);
        }

        /* Settings Modal */
        #settings-modal {
            display: none;
            position: absolute;
            bottom: 68px;
            left: 15px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 400;
            min-width: 220px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        #settings-modal.show {
            display: block;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            user-select: none;
            cursor: pointer;
            gap: 12px;
        }

        .setting-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #0a84ff;
            cursor: pointer;
        }

        /* Sentence Audio Buttons */
        .audio-num-btn {
            position: absolute;
            width: 60px;
            height: 48px;
            padding: 0;
            margin: 0;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid #fff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.15s ease;
        }

        .audio-num-btn:active {
            transform: scale(.95);
        }

        .audio-num-btn.playing {
            filter: brightness(.85);
            border-color: #fef08a;
        }

        #audio-player {
            display: none;
        }

        #audio-buttons-container {
            display: none;
        }

        /* ==================== 马卡龙配色音频控制组 ==================== */
        #audio-controls {
            position: absolute;
            top: 15px; /* 从 20px 上移到 15px */
            right: 15px; /* 与下一页按钮右对齐 */
            display: none; /* JS 显隐控制 */
            z-index: 260;
            width: 60px;
            height: 210px; /* 15 + 62 + 8 + 62 + 8 + 62 = 217px，留一点余量 */
        }

        /* 右侧主控制器纵向排列，最右侧对齐 */
        .right-ctrl-column {
            position: absolute;
            right: 0;
            top: 0;
            width: 60px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px; /* 从 10px 收紧到 8px */
        }

        /* 通用马卡龙按钮基础样式 */
        .macaron-btn {
            width: 60px;
            padding: 0;
            margin: 0;
            border: 2px solid #ffffff;
            outline: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s ease;
            user-select: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .macaron-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        /* 禁用状态 (Disabled) - 莫兰迪灰粉 */
        .macaron-btn:disabled {
            background-color: #E8E2E2 !important;
            color: #B5A8A8 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            border-color: #FFFFFF !important;
        }

        /* 1. 切换箭头按钮：#FFB7B2 (蜜桃奶粉) */
        .btn-arrow {
            height: 62px;
            border-radius: 16px;
            font-size: 18px;
            background-color: #FFB7B2;
            color: #5D4037;
        }

        /* 2. 主音频播放按钮：#FF9AA2 (草莓马卡龙粉) */
        .btn-main {
            height: 62px;
            border-radius: 16px;
            font-size: 14px;
            gap: 4px;
            background-color: #FF9AA2;
            color: #FFFFFF;
        }

        .btn-main.playing {
            background-color: #ff6b7a;
        }

        /* 3. 倍速按钮：放在控制组左侧，与右列并排 */
        .speed-wrap {
            position: absolute;
            right: 68px; /* 60px(右列宽) + 8px(间距) */
            top: 70px;   /* 与主播放按钮垂直对齐：62px(▲) + 8px(gap) = 70px */
            width: 60px;
            height: 62px;
        }

        .btn-speed {
            width: 60px;
            height: 58px;
            margin-top: 2px;
            border-radius: 14px;
            font-size: 15px;
            background-color: #FFDAC1;
            color: #6D4C41;
        }

        /* 倍速下拉弹框 */
        #speed-modal {
            display: none;
            position: absolute;
            left: 0;
            top: 62px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 6px;
            flex-direction: column;
            gap: 5px;
            z-index: 280;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
        }

        #speed-modal.show {
            display: flex;
        }

        .speed-option {
            width: 60px;
            height: 38px;
            padding: 0;
            margin: 0;
            background: #fff3ec;
            color: #6D4C41;
            border: 1px solid #FFDAC1;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .speed-option.active {
            background: #FF9AA2;
            color: #FFFFFF;
            border-color: #FF9AA2;
        }
        /* ======================================================================== */

        /* 上传页样式 */
        .quick-actions {
            margin-top: 22px;
            display: flex;
            gap: 12px;
        }

        .quick-action-btn {
            background: rgba(255,255,255,.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,.2);
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 18px;
            cursor: pointer;
        }

        .debug-legacy-btn {
            margin-top: 16px;
            background: none;
            border: none;
            color: rgba(255,255,255,.35);
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            max-width: 280px;
        }

        .overlay-page {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #2b2118;
            display: none;
            flex-direction: column;
        }

        .overlay-page.show {
            display: flex;
        }

        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            padding-top: calc(14px + env(safe-area-inset-top));
            background: #fff;
            flex-shrink: 0;
        }

        .overlay-close-btn {
            width: 36px;
            height: 36px;
            border: 0;
            background: none;
            font-size: 22px;
            color: #0a84ff;
            cursor: pointer;
        }

        .overlay-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }

        .overlay-grid {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-content: start;
            gap: 14px;
            padding: 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        @media (min-width: 700px) {
            .overlay-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (min-width: 980px) {
            .overlay-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        .book-card {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .book-card-cover {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 75%;
            border-radius: 10px 10px 4px 4px;
            overflow: hidden;
            background: #55524a;
        }

        .book-card-cover img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .book-card-spine {
            height: 8px;
            background: rgba(255,255,255,.85);
            border-radius: 0 0 6px 6px;
        }

        .book-card-title {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            line-height: 1.25;
        }

        .book-card.unavailable {
            opacity: .4;
        }

        .book-card.unavailable .book-card-cover::after {
            content: "?";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            background: rgba(0,0,0,.35);
        }

        .book-card--add .book-card-cover {
            border: 2px dashed rgba(255,255,255,.4);
            background: none;
        }

        .book-card-add-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: rgba(255,255,255,.6);
        }

        .stats-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .stats-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,.06);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .stats-row img {
            width: 56px;
            height: 42px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: #55524a;
        }

        .stats-row-info {
            flex: 1;
            min-width: 0;
        }

        .stats-row-title {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats-row-meta {
            color: rgba(255,255,255,.6);
            font-size: 12px;
            margin-top: 2px;
        }

        .stats-row-count {
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            min-width: 36px;
            text-align: center;
        }

        .stats-empty {
            color: rgba(255,255,255,.5);
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }

        html.display-mode #upload-container,
        html.display-mode #back-btn,
        html.display-mode #settings-btn,
        html.display-mode #settings-modal,
        html.display-mode .nav-btn,
        html.display-mode #audio-buttons-container,
        html.display-mode #audio-controls,
        html.display-mode .quick-actions,
        html.display-mode .overlay-page {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="upload-container">
        <div class="upload-card" onclick="pickNewFile()">
            <div class="upload-icon">📖</div>
            <div class="upload-title">Open File</div>
            <div class="upload-subtitle">Please select a file</div>
            <button class="btn-select">Select File</button>
        </div>

        <div class="quick-actions">
            <button class="quick-action-btn" onclick="openLibrary()">📚 My Library</button>
            <button class="quick-action-btn" onclick="openStats()">📊 Reading Stats</button>
        </div>

        <button class="debug-legacy-btn" onclick="document.getElementById('file-input').click()">
            🛠 Browse File
        </button>
        <input id="file-input" type="file" accept=".html,.htm" style="display:none" onchange="loadBookFile(this.files[0])">
    </div>

    <!-- 最近阅读 / 我的书架 -->
    <div id="library-overlay" class="overlay-page">
        <div class="overlay-header">
            <button class="overlay-close-btn" onclick="closeLibrary()" aria-label="Close">✕</button>
            <div class="overlay-title">My Library</div>
            <div style="width:36px"></div>
        </div>
        <div id="library-grid" class="overlay-grid"></div>
    </div>

    <!-- 阅读统计 -->
    <div id="stats-overlay" class="overlay-page">
        <div class="overlay-header">
            <button class="overlay-close-btn" onclick="closeStats()" aria-label="Close">✕</button>
            <div class="overlay-title">Reading Stats</div>
            <div style="width:36px"></div>
        </div>
        <div id="stats-list" class="stats-list"></div>
    </div>

    <div id="viewport">
        <div id="stage">

            <button id="back-btn" onclick="handleCloseClick()" aria-label="Back">✕</button>

            <!-- Bottom-left Setting Button & Modal -->
            <button id="settings-btn" onclick="toggleSettingsModal(event)" aria-label="Settings">⚙️</button>
            <div id="settings-modal" onclick="event.stopPropagation()">
                <label class="setting-item">
                    <span>Auto-play first audio</span>
                    <input type="checkbox" id="auto-play-toggle" onchange="handleAutoPlayChange(this.checked)">
                </label>
            </div>

            <img id="book-img" src="" alt="Slide">

            <button id="prev-btn" class="nav-btn" onclick="prevPage()" aria-label="Previous">‹</button>
            <button id="next-btn" class="nav-btn" onclick="nextPage()" aria-label="Next">›</button>

            <div id="audio-buttons-container"></div>

            <!-- 马卡龙配色音频控制组（宽度与下一页按钮一致，右对齐） -->
            <div id="audio-controls">
                <div class="speed-wrap">
                    <button id="audio-speed-btn" class="macaron-btn btn-speed" onclick="toggleSpeedModal(event)" title="切换倍速">1x</button>
                    <div id="speed-modal" onclick="event.stopPropagation()">
                        <button class="speed-option" onclick="selectSpeed(1)">1.0x</button>
                        <button class="speed-option" onclick="selectSpeed(1.1)">1.1x</button>
                        <button class="speed-option" onclick="selectSpeed(1.2)">1.2x</button>
                        <button class="speed-option" onclick="selectSpeed(1.3)">1.3x</button>
                        <button class="speed-option" onclick="selectSpeed(1.4)">1.4x</button>
                        <button class="speed-option" onclick="selectSpeed(1.5)">1.5x</button>
                    </div>
                </div>

                <div class="right-ctrl-column">
                    <button id="audio-prev-btn" class="macaron-btn btn-arrow" onclick="handleAudioPrev()" aria-label="Previous audio" title="上一首">▲</button>
                    <button id="audio-play-btn" class="macaron-btn btn-main" onclick="handleAudioReplay()" aria-label="Play current audio" title="播放/暂停">0/0 ▶</button>
                    <button id="audio-next-btn" class="macaron-btn btn-arrow" onclick="handleAudioNext()" aria-label="Next audio" title="下一首">▼</button>
                </div>
            </div>

            <audio id="audio-player"></audio>
        </div>
    </div>

    <script>
const STAGE_WIDTH = 960;
const STAGE_HEIGHT = 540;

const __isDisplayMode = new URLSearchParams(window.location.search).get('mode') === 'display';
if (__isDisplayMode) {
    document.documentElement.classList.add('display-mode');
}

let pages = [];
let currentIndex = 0;
let currentPlayingBtn = null;

let currentBookId = null;
let currentBookMeta = null;

let autoPlayFirstAudio = localStorage.getItem('autoPlayFirstAudio') !== 'false';

const uploadContainer = document.getElementById('upload-container');
const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
const imgEl = document.getElementById('book-img');
const audioEl = document.getElementById('audio-player');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const btnContainer = document.getElementById('audio-buttons-container');
const settingsModal = document.getElementById('settings-modal');
const autoPlayToggle = document.getElementById('auto-play-toggle');

const audioControls = document.getElementById('audio-controls');
const audioPrevBtn = document.getElementById('audio-prev-btn');
const audioPlayBtn = document.getElementById('audio-play-btn');
const audioNextBtn = document.getElementById('audio-next-btn');
const audioSpeedBtn = document.getElementById('audio-speed-btn');

autoPlayToggle.checked = autoPlayFirstAudio;

function resizeStage() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const scale = Math.min(
        vw / STAGE_WIDTH,
        vh / STAGE_HEIGHT
    );

    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener('resize', resizeStage);
window.addEventListener('orientationchange', () => {
    setTimeout(resizeStage, 100);
});

stage.addEventListener('click', (e) => {
    if (settingsModal.classList.contains('show')) {
        settingsModal.classList.remove('show');
    }
    const speedModalEl = document.getElementById('speed-modal');
    if (speedModalEl && speedModalEl.classList.contains('show')) {
        speedModalEl.classList.remove('show');
    }
});

function toggleSettingsModal(e) {
    e.stopPropagation();
    settingsModal.classList.toggle('show');
}

function handleAutoPlayChange(checked) {
    autoPlayFirstAudio = checked;
    localStorage.setItem('autoPlayFirstAudio', checked ? 'true' : 'false');
}

function parseAndOpenBook(htmlContent, meta) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlContent, 'text/html');
    const dataScript = doc.getElementById('book-data');

    if (!dataScript) {
        alert('Invalid file format! "book-data" element not found.');
        return false;
    }

    try {
        pages = JSON.parse(dataScript.textContent);

        if (!pages || pages.length === 0) {
            return false;
        }

        if (!pages[0].image) {
            const coverImgEl = doc.getElementById('cover-image') || doc.querySelector('img');
            if (coverImgEl) {
                pages[0].image = coverImgEl.getAttribute('src') || '';
            }
        }

        currentBookId = meta.id;
        currentBookMeta = meta;

        currentPlaybackRate = 1;

        uploadContainer.style.display = 'none';
        viewport.style.display = 'block';

        window.location.href = "app://orientation/landscape";

        resizeStage();

        audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
        audioEl.play().catch(() => { });

        loadPage(0, false);

        if (!__isDisplayMode) {
            setTimeout(() => {
                window.location.href = "app://display/loadbook";
            }, 60);

            scheduleCoverThumbnailThenRecordOpened(meta);
        }

        return true;
    } catch (err) {
        alert('Failed to parse data: ' + err.message);
        return false;
    }
}

function loadBookFile(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
        const htmlContent = e.target.result;
        parseAndOpenBook(htmlContent, {
            id: file.name,
            title: file.name.replace(/\.[^.]+$/, ''),
            bookmark: null
        });
    };

    reader.readAsText(file);
}

const RECENT_BOOKS_KEY = 'recentBooks';
const MAX_RECENT_BOOKS = 30;

function loadRecentBooks() {
    try {
        const raw = localStorage.getItem(RECENT_BOOKS_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch (err) {
        return [];
    }
}

function saveRecentBooks(list) {
    try {
        localStorage.setItem(RECENT_BOOKS_KEY, JSON.stringify(list));
    } catch (err) {
        console.log('saveRecentBooks failed:', err);
    }
}

function upsertRecentBook(entry) {
    let list = loadRecentBooks();
    const idx = list.findIndex(b => b.id === entry.id);

    if (idx >= 0) {
        list[idx] = Object.assign({}, list[idx], entry);
    } else {
        list.unshift(Object.assign({
            readCount: 0,
            lastCompletedAt: null,
            unavailable: false
        }, entry));
    }

    list.sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0));

    if (list.length > MAX_RECENT_BOOKS) {
        list = list.slice(0, MAX_RECENT_BOOKS);
    }

    saveRecentBooks(list);
    return list;
}

function recordBookOpened(meta) {
    upsertRecentBook(Object.assign({}, meta, { lastOpenedAt: Date.now() }));
}

function recordBookCompleted() {
    if (!currentBookId) return;

    const list = loadRecentBooks();
    const idx = list.findIndex(b => b.id === currentBookId);
    if (idx >= 0) {
        list[idx].readCount = (list[idx].readCount || 0) + 1;
        list[idx].lastCompletedAt = Date.now();
        saveRecentBooks(list);
    }
}

function generateCoverThumbnail() {
    try {
        const targetW = 240, targetH = 180;
        const canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, targetW, targetH);

        const iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
        if (iw && ih) {
            const scale = Math.max(targetW / iw, targetH / ih);
            const w = iw * scale, h = ih * scale;
            ctx.drawImage(imgEl, (targetW - w) / 2, (targetH - h) / 2, w, h);
        }

        return canvas.toDataURL('image/jpeg', 0.6);
    } catch (err) {
        console.log('generateCoverThumbnail failed:', err);
        return '';
    }
}

function scheduleCoverThumbnailThenRecordOpened(meta) {
    const doRecord = () => {
        recordBookOpened({
            id: meta.id,
            title: meta.title,
            bookmark: meta.bookmark || null,
            cover: generateCoverThumbnail()
        });
    };

    if (imgEl.complete && imgEl.naturalWidth > 0) {
        doRecord();
    } else {
        imgEl.addEventListener('load', doRecord, { once: true });
    }
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
}

function pickNewFile() {
    if (__isDisplayMode) return;
    window.location.href = "app://book/pick";
}

function reopenBook(id) {
    if (__isDisplayMode) return;

    const list = loadRecentBooks();
    const book = list.find(b => b.id === id);
    if (!book) return;

    if (!book.bookmark) {
        alert('这本书是用旧方式打开的，暂时没法自动重新打开，请重新选择一次文件。');
        return;
    }

    window.location.href = "app://book/reopen?id=" + encodeURIComponent(id) + "&bm=" + encodeURIComponent(book.bookmark);
}

window.__onFilePicked = function (bookmarkBase64, fileName, htmlContent) {
    parseAndOpenBook(htmlContent, {
        id: fileName,
        title: fileName.replace(/\.[^.]+$/, ''),
        bookmark: bookmarkBase64 || null
    });
};

window.__onReopenFailed = function (id) {
    const list = loadRecentBooks();
    const idx = list.findIndex(b => b.id === id);
    if (idx >= 0) {
        list[idx].unavailable = true;
        saveRecentBooks(list);
    }
    alert('这本书好像找不到了，可能被移动或删除了，请重新选择一次文件。');
    if (document.getElementById('library-overlay').classList.contains('show')) {
        renderLibraryGrid();
    }
};

window.__onCheckExistenceResult = function (resultsJson) {
    try {
        const results = JSON.parse(resultsJson);
        const list = loadRecentBooks();
        let changed = false;

        results.forEach(r => {
            const idx = list.findIndex(b => b.id === r.id);
            if (idx >= 0 && list[idx].unavailable !== !r.exists) {
                list[idx].unavailable = !r.exists;
                changed = true;
            }
        });

        if (changed) {
            saveRecentBooks(list);
        }

        if (document.getElementById('library-overlay').classList.contains('show')) {
            renderLibraryGrid();
        }
    } catch (err) {
        console.log('__onCheckExistenceResult failed:', err);
    }
};

function openLibrary() {
    renderLibraryGrid();
    document.getElementById('library-overlay').classList.add('show');

    if (!__isDisplayMode) {
        window.location.href = "app://book/checkexistence";
    }
}

function closeLibrary() {
    document.getElementById('library-overlay').classList.remove('show');
}

function renderLibraryGrid() {
    const grid = document.getElementById('library-grid');
    grid.innerHTML = '';

    const addTile = document.createElement('div');
    addTile.className = 'book-card book-card--add';
    addTile.innerHTML = '<div class="book-card-cover"><span class="book-card-add-icon">＋</span></div><div class="book-card-title">Open New Book</div>';
    addTile.onclick = () => { closeLibrary(); pickNewFile(); };
    grid.appendChild(addTile);

    loadRecentBooks().forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card' + (book.unavailable ? ' unavailable' : '');
        card.innerHTML =
            '<div class="book-card-cover"><img src="' + (book.cover || '') + '" alt=""></div>' +
            '<div class="book-card-spine"></div>' +
            '<div class="book-card-title">' + escapeHtml(book.title) + '</div>';
        card.onclick = () => {
            closeLibrary();
            reopenBook(book.id);
        };
        grid.appendChild(card);
    });
}

function openStats() {
    renderStatsList();
    document.getElementById('stats-overlay').classList.add('show');
}

function closeStats() {
    document.getElementById('stats-overlay').classList.remove('show');
}

function renderStatsList() {
    const container = document.getElementById('stats-list');
    container.innerHTML = '';

    const list = loadRecentBooks()
        .slice()
        .sort((a, b) => (b.lastCompletedAt || b.lastOpenedAt || 0) - (a.lastCompletedAt || a.lastOpenedAt || 0));

    if (list.length === 0) {
        container.innerHTML = '<div class="stats-empty">还没有阅读记录</div>';
        return;
    }

    list.forEach(book => {
        const row = document.createElement('div');
        row.className = 'stats-row';

        const metaText = book.lastCompletedAt
            ? ('最近读完：' + formatRelativeTime(book.lastCompletedAt))
            : '还没有读完过';

        row.innerHTML =
            '<img src="' + (book.cover || '') + '" alt="">' +
            '<div class="stats-row-info">' +
                '<div class="stats-row-title">' + escapeHtml(book.title) + '</div>' +
                '<div class="stats-row-meta">' + metaText + '</div>' +
            '</div>' +
            '<div class="stats-row-count">' + (book.readCount || 0) + '</div>';

        container.appendChild(row);
    });
}

function formatRelativeTime(ts) {
    const diffMs = Date.now() - ts;
    const diffMin = Math.round(diffMs / 60000);
    if (diffMin < 1) return '刚刚';
    if (diffMin < 60) return diffMin + ' 分钟前';
    const diffHour = Math.round(diffMin / 60);
    if (diffHour < 24) return diffHour + ' 小时前';
    const diffDay = Math.round(diffHour / 24);
    if (diffDay < 30) return diffDay + ' 天前';
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function handleCloseClick() {
    const isLastPage = currentIndex === pages.length - 1;

    if (isLastPage) {
        closeBook();
        return;
    }

    if (window.confirm('Are you sure you want to exit the current book?')) {
        closeBook();
    }
}

function closeBook() {
    if (pages.length > 0 && currentIndex === pages.length - 1) {
        recordBookCompleted();
    }

    stopAudio();

    pages = [];
    currentIndex = 0;
    currentBookId = null;
    currentBookMeta = null;

    if (settingsModal.classList.contains('show')) {
        settingsModal.classList.remove('show');
    }

    viewport.style.display = 'none';
    uploadContainer.style.display = 'flex';

    document.getElementById('file-input').value = '';

    window.location.href = "app://orientation/portrait";

    if (!__isDisplayMode) {
        setTimeout(() => {
            window.location.href = "app://display/close";
        }, 60);
    }
}

function updateNavState() {
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === pages.length - 1;
}

function layoutImage() {
    if (!imgEl.naturalWidth || !imgEl.naturalHeight) {
        return;
    }

    const originalWidth = imgEl.naturalWidth;
    const originalHeight = imgEl.naturalHeight;

    const scale = Math.min(
        STAGE_WIDTH / originalWidth,
        STAGE_HEIGHT / originalHeight
    );

    const width = originalWidth * scale;
    const height = originalHeight * scale;

    imgEl.style.width = width + 'px';
    imgEl.style.height = height + 'px';
    imgEl.style.left = ((STAGE_WIDTH - width) / 2) + 'px';
    imgEl.style.top = ((STAGE_HEIGHT - height) / 2) + 'px';
}

function loadPage(index, notifyDisplay = true) {
    if (index < 0 || index >= pages.length) return;

    currentIndex = index;
    stopAudio();

    const page = pages[currentIndex];

    imgEl.onload = layoutImage;
    imgEl.src = page.image || '';

    updateNavState();
    renderSentenceButtons(page);

    if (imgEl.complete) {
        layoutImage();
    }

    currentAudioIndex = -1;
    updateAudioControlsUI();

    if (!__isDisplayMode && autoPlayFirstAudio && page.sentenceAudios && page.sentenceAudios.length > 0) {
        playAudioAt(0);
    }

    if (!__isDisplayMode && notifyDisplay) {
        setTimeout(() => {
            window.location.href = "app://display/page/" + currentIndex;
        }, 30);
    }
}

function renderSentenceButtons(page) {
    btnContainer.innerHTML = '';

    if (!page.sentenceAudios || page.sentenceAudios.length === 0) {
        return;
    }

    const btnWidth = 60;
    const btnHeight = 48;
    const spacing = 8;

    const topMargin = 8;

    const navButtonHeight = 70;
    const nextBtnTop = (STAGE_HEIGHT - navButtonHeight) / 2;
    const nextBtnBottom = nextBtnTop + navButtonHeight;
    const skipGap = 8;

    /* 避开右侧控制组 (宽 60px + 边距 15px + 间距) */
    const baseLeft = STAGE_WIDTH - 90 - btnWidth;

    const macaronColors = [
        '#FF9AA2',
        '#FFB7B2',
        '#FFDAC1',
        '#E2F0CB',
        '#B5EAD7',
        '#C7CEEA'
    ];

    page.sentenceAudios.forEach((audioUri, idx) => {
        const col = Math.floor(idx / 8);
        const row = idx % 8;

        const left = baseLeft - col * (btnWidth + spacing);

        let top;
        if (row < 4) {
            top = topMargin + row * (btnHeight + spacing);
        } else {
            top = nextBtnBottom + skipGap + (row - 4) * (btnHeight + spacing);
        }

        if (left < 10 || top + btnHeight > STAGE_HEIGHT - 10) {
            return;
        }

        const btn = document.createElement('button');
        btn.className = 'audio-num-btn';
        btn.style.left = left + 'px';
        btn.style.top = top + 'px';
        btn.style.backgroundColor = macaronColors[idx % macaronColors.length];
        btn.textContent = String(idx + 1);

        btn.onclick = function(e) {
            e.stopPropagation();
            playSingleAudio(audioUri, btn);
        };

        btnContainer.appendChild(btn);
    });
}

function playSingleAudio(uri, btnEl) {
    stopAudio();

    if (!uri) return;

    if (btnEl) {
        currentPlayingBtn = btnEl;
        currentPlayingBtn.classList.add('playing');
    }

    audioEl.src = uri;
    audioEl.onended = function() {
        stopAudio();
    };

    audioEl.play().catch(err => {
        console.log('Playback restricted:', err);
    });
}

function stopAudio() {
    audioEl.pause();
    audioEl.removeAttribute('src');
    audioEl.load();
    audioEl.onended = null;

    if (currentPlayingBtn) {
        currentPlayingBtn.classList.remove('playing');
        currentPlayingBtn = null;
    }

    if (audioPlayBtn) {
        audioPlayBtn.classList.remove('playing');
    }
}

const SPEED_STEPS = [1, 1.1, 1.2, 1.3, 1.4, 1.5];
let currentAudioIndex = -1;
let currentPlaybackRate = 1;

function currentSentenceAudios() {
    const page = pages[currentIndex];
    return (page && page.sentenceAudios) ? page.sentenceAudios : [];
}

function formatSpeedLabel(rate) {
    return rate.toFixed(1).replace(/\.0$/, '') + 'x';
}

function updateAudioControlsUI() {
    const list = currentSentenceAudios();
    const total = list.length;

    /* 有音频时显示控制组 */
    audioControls.style.display = total > 0 ? 'block' : 'none';
    if (total === 0) return;

    const displayNum = currentAudioIndex >= 0 ? (currentAudioIndex + 1) : 1;
    audioPlayBtn.textContent = displayNum + '/' + total + ' ▶';

    audioPrevBtn.disabled = currentAudioIndex <= 0;
    audioNextBtn.disabled = currentAudioIndex >= total - 1;
    audioSpeedBtn.textContent = formatSpeedLabel(currentPlaybackRate);

    document.querySelectorAll('.speed-option').forEach(btn => {
        const rate = parseFloat(btn.textContent);
        btn.classList.toggle('active', Math.abs(rate - currentPlaybackRate) < 0.001);
    });
}

function playAudioAt(index) {
    const list = currentSentenceAudios();
    if (index < 0 || index >= list.length) return;

    currentAudioIndex = index;
    updateAudioControlsUI();
    playSentenceAudio(list[index]);
}

function playSentenceAudio(uri) {
    stopAudio();

    if (!uri) return;

    audioEl.src = uri;
    audioEl.playbackRate = currentPlaybackRate;

    audioEl.onloadedmetadata = function () {
        audioEl.playbackRate = currentPlaybackRate;
    };

    audioEl.onended = function () {
        audioPlayBtn.classList.remove('playing');
    };

    audioPlayBtn.classList.add('playing');

    audioEl.play().catch(err => {
        console.log('Playback restricted:', err);
    });
}

function handleAudioPrev() {
    if (currentAudioIndex > 0) {
        playAudioAt(currentAudioIndex - 1);
    }
}

function handleAudioNext() {
    if (currentAudioIndex < currentSentenceAudios().length - 1) {
        playAudioAt(currentAudioIndex + 1);
    }
}

function handleAudioReplay() {
    if (currentAudioIndex >= 0) {
        playAudioAt(currentAudioIndex);
    } else if (currentSentenceAudios().length > 0) {
        playAudioAt(0);
    }
}

function toggleSpeedModal(e) {
    e.stopPropagation();
    document.getElementById('speed-modal').classList.toggle('show');
}

function closeSpeedModal() {
    document.getElementById('speed-modal').classList.remove('show');
}

function selectSpeed(rate) {
    currentPlaybackRate = rate;
    closeSpeedModal();
    updateAudioControlsUI();

    if (currentAudioIndex >= 0) {
        playAudioAt(currentAudioIndex);
    }
}

function nextPage() {
    if (currentIndex < pages.length - 1) {
        loadPage(currentIndex + 1);
    }
}

function prevPage() {
    if (currentIndex > 0) {
        loadPage(currentIndex - 1);
    }
}

document.addEventListener('keydown', function(e) {
    if (viewport.style.display === 'block') {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
            nextPage();
        }

        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            prevPage();
        }

        if (e.key === 'Escape') {
            handleCloseClick();
        }
    }
});

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

const SWIPE_MIN_DISTANCE = 50;
const SWIPE_MAX_DURATION = 600;
const SWIPE_MAX_VERTICAL = 60;

function isInteractiveSwipeTarget(target) {
    return !!(target && target.closest && target.closest(
        '.nav-btn, #back-btn, #settings-btn, #settings-modal, .audio-num-btn, #audio-controls'
    ));
}

viewport.addEventListener('touchstart', (e) => {
    if (__isDisplayMode || !pages.length || e.touches.length !== 1) return;
    if (isInteractiveSwipeTarget(e.target)) return;

    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
}, { passive: true });

viewport.addEventListener('touchend', (e) => {
    if (__isDisplayMode || !pages.length || !touchStartTime) return;
    if (isInteractiveSwipeTarget(e.target)) {
        touchStartTime = 0;
        return;
    }

    const t = e.changedTouches[0];
    const deltaX = t.clientX - touchStartX;
    const deltaY = t.clientY - touchStartY;
    const duration = Date.now() - touchStartTime;
    touchStartTime = 0;

    if (duration > SWIPE_MAX_DURATION) return;
    if (Math.abs(deltaY) > SWIPE_MAX_VERTICAL) return;
    if (Math.abs(deltaX) < SWIPE_MIN_DISTANCE) return;

    if (deltaX < 0) {
        if (currentIndex < pages.length - 1) {
            nextPage();
        } else {
            closeBook();
        }
    } else {
        if (currentIndex > 0) {
            prevPage();
        }
    }
}, { passive: true });

window.__loadBookFromNative = function (pagesJson) {
    try {
        pages = JSON.parse(pagesJson);
        if (!pages || pages.length === 0) return;

        uploadContainer.style.display = 'none';
        viewport.style.display = 'block';
        resizeStage();
    } catch (err) {
        console.error('__loadBookFromNative failed:', err);
    }
};

window.__showPageFromNative = function (index) {
    if (!pages || pages.length === 0) return;
    loadPage(index);
};

window.__closeBookFromNative = function () {
    stopAudio();
    pages = [];
    currentIndex = 0;
    viewport.style.display = 'none';
};
