<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS PWA 沉浸式支持 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="绘本阅读器">

    <title>iCloud 绘本阅读器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			overflow: hidden;
			background-color: #ffffff;
			color: #333333;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

        /* 文件选择界面 */
		#upload-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
			background-color: #1c1c1e;
			text-align: center;
		}

        .upload-card {
            border: 2px dashed #444444;
            border-radius: 24px;
            padding: 40px 30px;
            width: 85%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-card:active {
            background: rgba(255, 255, 255, 0.15);
            border-color: #0a84ff;
            transform: scale(0.98);
        }

        .upload-icon { font-size: 56px; margin-bottom: 12px; }
        .upload-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #ffffff; }
        .upload-subtitle { color: #8e8e93; font-size: 14px; margin-bottom: 20px; }

        .btn-select {
            background-color: #0a84ff;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
        }

        /* 舞台容器 */
        #stage-container {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background-color: #000000; /* 将空白处底色设置为黑色 */
            overflow: hidden;
            
            /* 上下不需要额外的空间边距（顶满），左右根据需要留白 */
            padding-top: 0;
            padding-bottom: 0;
            padding-left: max(env(safe-area-inset-left), 40px);   /* 左右留出空间 */
            padding-right: max(env(safe-area-inset-right), 40px);
        }

        .slide-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000; /* 包装容器背景也设为黑色，确保两侧留白处纯黑 */
            border-radius: 0;          /* 取消圆角，让图片上下边缘完全贴合屏幕 */
            box-shadow: none;          /* 去掉阴影 */
            overflow: hidden;
        }
        
        .slide-img {
            max-width: 100%;
            max-height: 100%;          /* 高度拉满，上下不留空间 */
            object-fit: contain;       /* 等比缩放，高度撑满后，左右自然产生黑色空白边 */
            border: none;
            outline: none;
            display: block;
        }

        /* 左右翻页按钮 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 72px;
            background-color: rgba(0, 0, 0, 0.28);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            outline: none;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: background-color 0.2s;
        }
        .nav-btn:active { background-color: rgba(0, 0, 0, 0.45); }
        .nav-btn:disabled { opacity: 0.1; cursor: not-allowed; }
        /* 左右翻页按钮：往内收一点 */
        #prev-btn { left: calc(env(safe-area-inset-left) + 20px); }
        #next-btn { right: calc(env(safe-area-inset-right) + 20px); }

        /* 左上角返回按钮 */
        #back-btn {
            position: absolute;
            top: max(env(safe-area-inset-top), 15px);
            left: max(env(safe-area-inset-left), 20px);
            width: 44px;
            height: 44px;
            background-color: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        /* 右上角音频按钮容器 */
        #audio-buttons-container {
            position: absolute;
            top: max(env(safe-area-inset-top), 15px);
            right: max(env(safe-area-inset-right), 20px);
            bottom: max(env(safe-area-inset-bottom), 15px);
            display: flex;
            flex-direction: column;  /* 纵向排列 */
            flex-wrap: wrap-reverse; /* 超过一列时向左扩展 */
            align-content: flex-start;
            gap: 10px;
            z-index: 300;
            pointer-events: none;
        }

        /* 浅粉红数字按钮外观 */
        .audio-num-btn {
            pointer-events: auto;
            width: 54px;
            height: 42px;
            background-color: #fca5a5;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: transform 0.1s, background-color 0.2s;
            outline: none;
        }

        .audio-num-btn:active { transform: scale(0.94); }
        .audio-num-btn.playing {
            background-color: #ef4444 !important;
            border-color: #fef08a;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        /* 移动端竖屏持握自动旋转 90 度 */
        @media screen and (orientation: portrait) {
            #stage-container {
                width: 100dvh !important;
                height: 100vw !important;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
        }
    </style>
</head>
<body>

    <!-- 1. 文件选择界面 -->
    <div id="upload-container">
        <div class="upload-card" onclick="document.getElementById('file-input').click()">
            <div class="upload-icon">📖</div>
            <div class="upload-title">打开 iCloud 绘本</div>
            <div class="upload-subtitle">请选择导出的绘本 HTML 数据包</div>
            <button class="btn-select">选择文件</button>
        </div>
        <input type="file" id="file-input" accept=".html,.htm" style="display: none;" onchange="loadBookFile(this.files[0])">
    </div>

    <!-- 2. 绘本播放舞台 -->
    <div id="stage-container">
        <!-- 返回主页按钮 -->
        <button id="back-btn" onclick="closeBook()" aria-label="返回">✕</button>

        <div class="slide-wrapper">
            <img id="book-img" class="slide-img" src="" alt="Slide" />
        </div>

        <!-- 左右翻页按钮 -->
        <button id="prev-btn" class="nav-btn" onclick="prevPage()" aria-label="上一页">‹</button>
        <button id="next-btn" class="nav-btn" onclick="nextPage()" aria-label="下一页">›</button>

        <!-- 动态 1, 2, 3 音频按钮容器 (纵向) -->
        <div id="audio-buttons-container"></div>

        <audio id="audio-player"></audio>
    </div>

    <script>
        let pages = [];
        let currentIndex = 0;
        let currentPlayingBtn = null;

        const uploadContainer = document.getElementById('upload-container');
        const stageContainer = document.getElementById('stage-container');
        const imgEl = document.getElementById('book-img');
        const audioEl = document.getElementById('audio-player');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const btnContainer = document.getElementById('audio-buttons-container');

        function loadBookFile(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const htmlContent = e.target.result;
                
                // 使用 DOMParser 解析文件中的 JSON 数据
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                const dataScript = doc.getElementById('book-data');

                if (!dataScript) {
                    alert('无效的绘本数据包！未找到 book-data 节点。');
                    return;
                }

                try {
                    pages = JSON.parse(dataScript.textContent);
                    if (pages && pages.length > 0) {
                        uploadContainer.style.display = 'none';
                        stageContainer.style.display = 'flex';
						// 通知 MAUI 切换为横屏
						window.location.href = "app://orientation/landscape";
                        
                        // 解禁 iOS Safari 音频限制
                        audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
                        audioEl.play().catch(() => {});

                        loadPage(0);
                    }
                } catch (err) {
                    alert('解析绘本数据失败: ' + err.message);
                }
            };

            reader.readAsText(file);
        }

        function closeBook() {
            stopAudio();
            pages = [];
            currentIndex = 0;
            stageContainer.style.display = 'none';
            uploadContainer.style.display = 'flex';
            document.getElementById('file-input').value = '';
			
			// 通知 MAUI 切换回竖屏
			window.location.href = "app://orientation/portrait";
        }

        function updateNavState() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === pages.length - 1;
        }

        function loadPage(index) {
            if (index < 0 || index >= pages.length) return;
            currentIndex = index;
            stopAudio();

            const page = pages[currentIndex];
            imgEl.src = page.image || '';
            updateNavState();

            // 渲染右侧纵向排列的 1, 2, 3 句音频按钮
            btnContainer.innerHTML = '';
            if (page.sentenceAudios && page.sentenceAudios.length > 0) {
                page.sentenceAudios.forEach((audioUri, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'audio-num-btn';
                    btn.textContent = (idx + 1).toString();
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        playSingleAudio(audioUri, btn);
                    };
                    btnContainer.appendChild(btn);
                });

                // 首次切页自动播放第 1 句音频
                if (page.sentenceAudios[0]) {
                    const firstBtn = btnContainer.children[0];
                    playSingleAudio(page.sentenceAudios[0], firstBtn);
                }
            }
        }

        function playSingleAudio(uri, btnEl) {
            stopAudio();
            if (!uri) return;

            currentPlayingBtn = btnEl;
            if (currentPlayingBtn) currentPlayingBtn.classList.add('playing');

            audioEl.src = uri;
            audioEl.onended = () => { stopAudio(); };
            audioEl.play().catch(err => console.log('播放受限:', err));
        }

        function stopAudio() {
            audioEl.pause();
            audioEl.src = '';
            audioEl.onended = null;
            if (currentPlayingBtn) {
                currentPlayingBtn.classList.remove('playing');
                currentPlayingBtn = null;
            }
        }

        function nextPage() {
            if (currentIndex < pages.length - 1) loadPage(currentIndex + 1);
        }

        function prevPage() {
            if (currentIndex > 0) loadPage(currentIndex - 1);
        }

        document.addEventListener('keydown', (e) => {
            if (stageContainer.style.display === 'flex') {
                if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextPage();
                if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
                if (e.key === 'Escape') closeBook();
            }
        });
    </script>
</body>
</html>
