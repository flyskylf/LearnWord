<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reader">
    <title>Reader</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #000;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* File Upload Interface */
        #upload-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: #1c1c1e;
            text-align: center;
        }

        .upload-card {
            border: 2px dashed #444;
            border-radius: 24px;
            padding: 40px 30px;
            width: 85%;
            max-width: 420px;
            background: rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .upload-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .upload-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .upload-subtitle {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-select {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        #viewport {
            position: fixed;
            inset: 0;
            display: none;
            overflow: hidden;
            background: #000;
        }

        :root {
            --stage-width: 960px;
            --stage-height: 540px;
        }

        #stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--stage-width);
            height: var(--stage-height);
            transform-origin: center center;
            background: #fff;
            overflow: hidden;
        }

        #book-img {
            position: absolute;
            display: block;
            border: 0;
            outline: 0;
            max-width: none;
            max-height: none;
        }

        .nav-btn {
            position: absolute;
            width: 60px;
            height: 70px;
            padding: 0;
            margin: 0;
            background: rgba(120,120,120,.65);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 32px;
            font-weight: 700;
            line-height: 70px;
            text-align: center;
            z-index: 200;
            cursor: pointer;
        }

        #prev-btn {
            left: 15px;
            top: 235px; /* (540 - 70) / 2 */
        }

        #next-btn {
            right: 15px;
            top: 235px;
        }

        .nav-btn:disabled {
            display: none;
        }

        /* Top-left Back Button */
        #back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            padding: 0;
            margin: 0;
            background: rgba(0,0,0,.25);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 20px;
            z-index: 300;
            cursor: pointer;
        }

        /* Bottom-left Setting Button */
        #settings-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            padding: 0;
            margin: 0;
            background: rgba(0,0,0,.35);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 22px;
            z-index: 300;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            #settings-btn:active {
                transform: scale(0.95);
            }

        /* Settings Modal */
        #settings-modal {
            display: none;
            position: absolute;
            bottom: 68px;
            left: 15px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 400;
            min-width: 220px;
            border: 1px solid rgba(255,255,255,0.15);
        }

            #settings-modal.show {
                display: block;
            }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            user-select: none;
            cursor: pointer;
            gap: 12px;
        }

            .setting-item input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #0a84ff;
                cursor: pointer;
            }

        /* Sentence Audio Buttons */
        .audio-num-btn {
            position: absolute;
            width: 60px;
            height: 48px;
            padding: 0;
            margin: 0;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid #fff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            cursor: pointer;
            box-shadow: 1px 2px 3px rgba(0,0,0,.5);
        }

            .audio-num-btn:active {
                transform: scale(.96);
            }

            .audio-num-btn.playing {
                filter: brightness(.85);
                border-color: #fef08a;
            }

        #audio-player {
            display: none;
        }

        /*
         * 旧版"每句一个编号按钮"的容器——按要求先隐藏、不删除，方便以后恢复。
         * renderSentenceButtons() 仍然会正常执行、生成这些按钮，只是整体不显示。
         */
        #audio-buttons-container {
            display: none;
        }

        /* ==================== 新版播放控件：右上角 2 列布局 ====================
           左列：倍速按钮，单独一个，纵向对齐到右列"播放"按钮那一行
           右列：上一句(▲) / 播放(▶，最大) / 下一句(▼) 纵向堆叠
           整体比第一版明显放大，方便手指点按。 */
        #audio-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none; /* 有配音的页才显示，由 JS 控制 */
            z-index: 260;

            display: grid;
            grid-template-columns: 70px 86px;
            grid-template-rows: auto auto auto;
            column-gap: 8px;
            row-gap: 6px; /* 行间距收紧一点，给按钮本身留出放大的空间，同时不碰到下面的翻页按钮 */
        }

        .audio-ctrl-btn {
            width: 100%;
            height: 56px;
            padding: 0;
            margin: 0;
            background: rgba(120,120,120,.7);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }

            .audio-ctrl-btn:disabled {
                opacity: .35;
                cursor: default;
            }

        .audio-ctrl-btn--prev {
            grid-column: 2;
            grid-row: 1;
        }

        .audio-ctrl-btn--next {
            grid-column: 2;
            grid-row: 3;
        }

        .audio-play-wrap {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .audio-ctrl-btn--play {
            width: 86px;
            height: 64px;
            font-size: 30px;
            background: rgba(10,132,255,.9);
        }

            .audio-ctrl-btn--play.playing {
                background: rgba(255,149,0,.95);
            }

        .speed-wrap {
            grid-column: 1;
            grid-row: 2;
            align-self: center;
            position: relative; /* 弹出的速度选择条以这里为基准定位 */
        }

        .audio-ctrl-btn--speed {
            font-size: 18px;
            font-weight: 800;
            background: rgba(80,80,80,.6);
        }

        #audio-counter {
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0,0,0,.6);
        }

        /* 点击倍速按钮弹出的选择条——直接点想要的档位，不用一格格转 */
        #speed-modal {
            display: none;
            position: absolute;
            right: calc(100% + 8px);
            top: 50%;
            transform: translateY(-50%);
            background: rgba(30,30,30,.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 10px;
            padding: 6px;
            display: none;
            flex-direction: row;
            gap: 6px;
            z-index: 280;
            white-space: nowrap;
        }

            #speed-modal.show {
                display: flex;
            }

        .speed-option {
            width: 52px;
            height: 44px;
            padding: 0;
            margin: 0;
            background: rgba(255,255,255,.12);
            color: #fff;
            border: 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

            .speed-option.active {
                background: rgba(10,132,255,.9);
            }
        /* ======================================================================== */

        /* ==================== 上传页快捷入口：最近阅读 / 统计 ==================== */
        .quick-actions {
            margin-top: 22px;
            display: flex;
            gap: 12px;
        }

        .quick-action-btn {
            background: rgba(255,255,255,.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,.2);
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 18px;
            cursor: pointer;
        }

        .debug-legacy-btn {
            margin-top: 16px;
            background: none;
            border: none;
            color: rgba(255,255,255,.35);
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            max-width: 280px;
        }
        /* ======================================================================== */

        /* ==================== 最近阅读 / 统计 弹出页 ==================== */
        .overlay-page {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #2b2118;
            display: none;
            flex-direction: column;
        }

            .overlay-page.show {
                display: flex;
            }

        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            padding-top: calc(14px + env(safe-area-inset-top));
            background: #fff;
            flex-shrink: 0;
        }

        .overlay-close-btn {
            width: 36px;
            height: 36px;
            border: 0;
            background: none;
            font-size: 22px;
            color: #0a84ff;
            cursor: pointer;
        }

        .overlay-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }

        .overlay-grid {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: grid;
            /* 手机竖屏固定一行 3 个；屏幕更宽(iPad 竖屏/横屏)再按宽度多给几列 */
            grid-template-columns: repeat(3, 1fr);
            /*
             * 关键：Grid 默认会把"容器比内容高出来的那部分空间"均匀撑到每一行之间，
             * 书不多的时候(比如只有 2 行)就会出现行与行之间一大片空白——
             * 把 align-content 设成 start，让内容贴顶紧凑排列，多余空间统一留在最下面。
             */
            align-content: start;
            gap: 14px;
            padding: 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        @media (min-width: 700px) {
            .overlay-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (min-width: 980px) {
            .overlay-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        .book-card {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        /*
         * 封面统一裁成 4:3——故意不用 CSS 的 aspect-ratio 属性，
         * 那是 iOS 15 才支持的新特性，老系统上不生效就会整个不裁切、按原图比例撑开
         * (之前封面被拉得很高、挤出一大片空白就是这个原因)。
         * 这里换成兼容性最好的"padding-top 百分比"经典写法，内部图片绝对定位铺满裁切。
         */
        .book-card-cover {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 75%; /* 4:3 = 3/4 = 75% */
            border-radius: 10px 10px 4px 4px;
            overflow: hidden;
            background: #55524a;
        }

            .book-card-cover img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

        .book-card-spine {
            height: 8px;
            background: rgba(255,255,255,.85);
            border-radius: 0 0 6px 6px;
        }

        .book-card-title {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            line-height: 1.25;
        }

        .book-card.unavailable {
            opacity: .4;
        }

            .book-card.unavailable .book-card-cover::after {
                content: "?";
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 28px;
                color: #fff;
                background: rgba(0,0,0,.35);
            }

        .book-card--add .book-card-cover {
            border: 2px dashed rgba(255,255,255,.4);
            background: none;
        }

        .book-card-add-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: rgba(255,255,255,.6);
        }

        .stats-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .stats-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,.06);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

            .stats-row img {
                width: 56px;
                height: 42px;
                object-fit: cover;
                border-radius: 6px;
                flex-shrink: 0;
                background: #55524a;
            }

        .stats-row-info {
            flex: 1;
            min-width: 0;
        }

        .stats-row-title {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats-row-meta {
            color: rgba(255,255,255,.6);
            font-size: 12px;
            margin-top: 2px;
        }

        .stats-row-count {
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            min-width: 36px;
            text-align: center;
        }

        .stats-empty {
            color: rgba(255,255,255,.5);
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }
        /* ============================================================== */

        /*
         * 外接屏"展示模式" (?mode=display)：
         * 只保留内容画面本身，把上传界面、翻页按钮、设置、返回、句子音频按钮、
         * 新版播放控件、最近阅读/统计入口全部隐藏，因为电视屏幕不可触摸，
         * 这些控件在这份拷贝上没有意义。
         */
        html.display-mode #upload-container,
        html.display-mode #back-btn,
        html.display-mode #settings-btn,
        html.display-mode #settings-modal,
        html.display-mode .nav-btn,
        html.display-mode #audio-buttons-container,
        html.display-mode #audio-controls,
        html.display-mode .quick-actions,
        html.display-mode .overlay-page {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="upload-container">
        <div class="upload-card" onclick="pickNewFile()">
            <div class="upload-icon">📖</div>
            <div class="upload-title">Open File</div>
            <div class="upload-subtitle">Please select a file</div>
            <button class="btn-select">Select File</button>
        </div>

        <div class="quick-actions">
            <button class="quick-action-btn" onclick="openLibrary()">📚 My Library</button>
            <button class="quick-action-btn" onclick="openStats()">📊 Reading Stats</button>
        </div>

        <!--
            旧版"网页 <input type=file>"选择方式——保留下来方便调试，故意做得不起眼，
            跟上面的主入口(走原生文件选择器)区分开，避免日常使用时选错。
            注意：这条路径选出来的文件拿不到"安全作用域书签"，没法出现在
            My Library 里一键重新打开，只能当次用一下。
        -->
        <button class="debug-legacy-btn" onclick="document.getElementById('file-input').click()">
            🛠 网页方式选择文件（调试用，不支持重新打开）
        </button>
        <input id="file-input" type="file" accept=".html,.htm"
               style="display:none" onchange="loadBookFile(this.files[0])">
    </div>

    <!-- 最近阅读 / 我的书架 -->
    <div id="library-overlay" class="overlay-page">
        <div class="overlay-header">
            <button class="overlay-close-btn" onclick="closeLibrary()" aria-label="Close">✕</button>
            <div class="overlay-title">My Library</div>
            <div style="width:36px"></div>
        </div>
        <div id="library-grid" class="overlay-grid"></div>
    </div>

    <!-- 阅读统计 -->
    <div id="stats-overlay" class="overlay-page">
        <div class="overlay-header">
            <button class="overlay-close-btn" onclick="closeStats()" aria-label="Close">✕</button>
            <div class="overlay-title">Reading Stats</div>
            <div style="width:36px"></div>
        </div>
        <div id="stats-list" class="stats-list"></div>
    </div>

    <div id="viewport">
        <div id="stage">

            <button id="back-btn" onclick="handleCloseClick()" aria-label="Back">✕</button>

            <!-- Bottom-left Setting Button & Modal -->
            <button id="settings-btn" onclick="toggleSettingsModal(event)" aria-label="Settings">⚙️</button>
            <div id="settings-modal" onclick="event.stopPropagation()">
                <label class="setting-item">
                    <span>Auto-play first audio</span>
                    <input type="checkbox" id="auto-play-toggle" onchange="handleAutoPlayChange(this.checked)">
                </label>
            </div>

            <img id="book-img" src="" alt="Slide">

            <button id="prev-btn" class="nav-btn" onclick="prevPage()" aria-label="Previous">‹</button>
            <button id="next-btn" class="nav-btn" onclick="nextPage()" aria-label="Next">›</button>

            <div id="audio-buttons-container"></div>

            <!-- 新版播放控件：上一句 / 播放当前 / 下一句，加一个倍速按钮和"第几句/共几句"计数 -->
            <div id="audio-controls">
                <button id="audio-prev-btn" class="audio-ctrl-btn audio-ctrl-btn--prev" onclick="handleAudioPrev()" aria-label="Previous audio">▲</button>

                <div class="audio-play-wrap">
                    <button id="audio-play-btn" class="audio-ctrl-btn audio-ctrl-btn--play" onclick="handleAudioReplay()" aria-label="Play current audio">▶</button>
                    <div id="audio-counter">0 / 0</div>
                </div>

                <button id="audio-next-btn" class="audio-ctrl-btn audio-ctrl-btn--next" onclick="handleAudioNext()" aria-label="Next audio">▼</button>

                <div class="speed-wrap">
                    <button id="audio-speed-btn" class="audio-ctrl-btn audio-ctrl-btn--speed" onclick="toggleSpeedModal(event)">1x</button>
                    <div id="speed-modal" onclick="event.stopPropagation()">
                        <button class="speed-option" onclick="selectSpeed(1)">1.0x</button>
                        <button class="speed-option" onclick="selectSpeed(1.1)">1.1x</button>
                        <button class="speed-option" onclick="selectSpeed(1.2)">1.2x</button>
                        <button class="speed-option" onclick="selectSpeed(1.3)">1.3x</button>
                    </div>
                </div>
            </div>

            <audio id="audio-player"></audio>
        </div>
    </div>

    <script>
const STAGE_WIDTH = 960;
const STAGE_HEIGHT = 540;

// ==================== 外接屏展示模式 ====================
// 通过 URL 参数 ?mode=display 区分：这份网页实例是加载在电视(外接屏)上的"只读镜像"，
// 还是加载在 iPad/iPhone 本机屏幕上的"可交互"主实例。
const __isDisplayMode = new URLSearchParams(window.location.search).get('mode') === 'display';
if (__isDisplayMode) {
    document.documentElement.classList.add('display-mode');
}
// ==========================================================

let pages = [];
let currentIndex = 0;
let currentPlayingBtn = null;

// 当前打开的这本书的标识信息（用于"最近阅读列表"和"阅读统计"）
let currentBookId = null;
let currentBookMeta = null; // { id, title, bookmark }

// Default to auto-play first audio unless explicitly turned off
let autoPlayFirstAudio = localStorage.getItem('autoPlayFirstAudio') !== 'false';

const uploadContainer = document.getElementById('upload-container');
const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
const imgEl = document.getElementById('book-img');
const audioEl = document.getElementById('audio-player');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const btnContainer = document.getElementById('audio-buttons-container');
const settingsModal = document.getElementById('settings-modal');
const autoPlayToggle = document.getElementById('auto-play-toggle');

// 新版播放控件（右上角纵向三按钮 + 倍速 + 计数）
const audioControls = document.getElementById('audio-controls');
const audioPrevBtn = document.getElementById('audio-prev-btn');
const audioPlayBtn = document.getElementById('audio-play-btn');
const audioNextBtn = document.getElementById('audio-next-btn');
const audioCounterEl = document.getElementById('audio-counter');
const audioSpeedBtn = document.getElementById('audio-speed-btn');

// Initialize checkbox state
autoPlayToggle.checked = autoPlayFirstAudio;

function resizeStage() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            const scale = Math.min(
                vw / STAGE_WIDTH,
                vh / STAGE_HEIGHT
            );

            stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

// ==================== 打开一本书的公共逻辑 ====================
// 不管书是"网页 <input type=file> 选的"还是"原生文件选择器/重新打开书签选的"，
// 最终都走这一个函数，避免同一套解析逻辑写两遍。
// meta: { id, title, bookmark }  —— bookmark 没有(null)就说明这本书以后不能自动重新打开。
function parseAndOpenBook(htmlContent, meta) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlContent, 'text/html');
    const dataScript = doc.getElementById('book-data');

    if (!dataScript) {
        alert('Invalid file format! "book-data" element not found.');
        return false;
    }

    try {
        pages = JSON.parse(dataScript.textContent);

        if (!pages || pages.length === 0) {
            return false;
        }

        // ==================== 特殊处理首图重复问题 ====================
        // 如果第一页图片为空，尝试从 DOM 中的 #cover-image 或第一个 <img> 提取封面 src
        if (!pages[0].image) {
            const coverImgEl = doc.getElementById('cover-image') || doc.querySelector('img');
            if (coverImgEl) {
                pages[0].image = coverImgEl.getAttribute('src') || '';
            }
        }
        // ==============================================================

        currentBookId = meta.id;
        currentBookMeta = meta;

        // 每次"打开一本书"（不管是新选的还是从最近阅读重新打开的同一本），倍速都回到默认 1x；
        // 书打开之后，不管翻页还是切换句子，倍速都不会再被自动改动。
        currentPlaybackRate = 1;

        uploadContainer.style.display = 'none';
        viewport.style.display = 'block';

        // 注意：不要在同一个 JS 同步任务里连续多次给 location.href 赋值——
        // 浏览器/WKWebView 只会真正处理"最后一次"赋值，前面几次会被静默打断。
        window.location.href = "app://orientation/landscape";

        resizeStage();

        // Unlock audio on iOS
        audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
        audioEl.play().catch(() => { });

        // 首次加载页面时不单独触发"翻页同步"通知，避免它再和下面的 loadbook 通知互相覆盖，
        // 外接屏那边会通过 loadbook 通知一次性拿到 pages + 当前页码。
        loadPage(0, false);

        if (!__isDisplayMode) {
            // 通知原生：书已经加载好了，请把 pages 数据同步给外接屏(如果已连接)。
            // 用 setTimeout 错开到下一个宏任务，确保上面的横屏命令已经被原生处理掉，不会被这条覆盖。
            setTimeout(() => {
                window.location.href = "app://display/loadbook";
            }, 60);

            // 记录到"最近阅读"列表——等封面图片真正加载完再截图，避免拿到一张空白图
            scheduleCoverThumbnailThenRecordOpened(meta);
        }

        return true;
    } catch (err) {
        alert('Failed to parse data: ' + err.message);
        return false;
    }
}

// 旧版：网页 <input type=file> 选文件（先保留，不删除）。
// 注意这条路径拿不到可以长期重新打开的安全作用域书签，bookmark 传 null。
function loadBookFile(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
        const htmlContent = e.target.result;
        parseAndOpenBook(htmlContent, {
            id: file.name,
            title: file.name.replace(/\.[^.]+$/, ''),
            bookmark: null
        });
    };

    reader.readAsText(file);
}

// ==================== 最近阅读 / 阅读统计：本地存储读写 ====================
const RECENT_BOOKS_KEY = 'recentBooks';
const MAX_RECENT_BOOKS = 30; // 实际存储的上限(留一些缓冲)，展示时按屏幕能放下多少来截取

function loadRecentBooks() {
    try {
        const raw = localStorage.getItem(RECENT_BOOKS_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch (err) {
        return [];
    }
}

function saveRecentBooks(list) {
    try {
        localStorage.setItem(RECENT_BOOKS_KEY, JSON.stringify(list));
    } catch (err) {
        console.log('saveRecentBooks failed:', err);
    }
}

function upsertRecentBook(entry) {
    let list = loadRecentBooks();
    const idx = list.findIndex(b => b.id === entry.id);

    if (idx >= 0) {
        list[idx] = Object.assign({}, list[idx], entry);
    } else {
        list.unshift(Object.assign({
            readCount: 0,
            lastCompletedAt: null,
            unavailable: false
        }, entry));
    }

    // 按"最近打开时间"排到最前
    list.sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0));

    // 超过上限就直接砍掉最旧的，不做更复杂的处理——这只是个辅助功能，不用太精细
    if (list.length > MAX_RECENT_BOOKS) {
        list = list.slice(0, MAX_RECENT_BOOKS);
    }

    saveRecentBooks(list);
    return list;
}

function recordBookOpened(meta) {
    // 只要打开过就要出现在"最近阅读"里，不要求读完
    upsertRecentBook(Object.assign({}, meta, { lastOpenedAt: Date.now() }));
}

function recordBookCompleted() {
    if (!currentBookId) return;

    const list = loadRecentBooks();
    const idx = list.findIndex(b => b.id === currentBookId);
    if (idx >= 0) {
        list[idx].readCount = (list[idx].readCount || 0) + 1;
        list[idx].lastCompletedAt = Date.now();
        saveRecentBooks(list);
    }
}

function generateCoverThumbnail() {
    try {
        const targetW = 240, targetH = 180; // 4:3，跟书架卡片的封面比例一致
        const canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, targetW, targetH);

        const iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
        if (iw && ih) {
            const scale = Math.max(targetW / iw, targetH / ih); // 裁切铺满，跟截图里的封面观感一致
            const w = iw * scale, h = ih * scale;
            ctx.drawImage(imgEl, (targetW - w) / 2, (targetH - h) / 2, w, h);
        }

        return canvas.toDataURL('image/jpeg', 0.6);
    } catch (err) {
        console.log('generateCoverThumbnail failed:', err);
        return '';
    }
}

function scheduleCoverThumbnailThenRecordOpened(meta) {
    const doRecord = () => {
        recordBookOpened({
            id: meta.id,
            title: meta.title,
            bookmark: meta.bookmark || null,
            cover: generateCoverThumbnail()
        });
    };

    if (imgEl.complete && imgEl.naturalWidth > 0) {
        doRecord();
    } else {
        imgEl.addEventListener('load', doRecord, { once: true });
    }
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
}

// 原生：重新打开某本书失败(文件被删除/移动，书签已经失效)

    const list = loadRecentBooks();
    const idx = list.findIndex(b => b.id === id);
    if (idx >= 0) {
        list[idx].unavailable = true;
        saveRecentBooks(list);
    }
    alert('这本书好像找不到了，可能被移动或删除了，请重新选择一次文件。');
    if (document.getElementById('library-overlay').classList.contains('show')) {
        renderLibraryGrid();

};

// 原生：批量存在性检查的结果，格式 [{id, exists}, ...]
window.__onCheckExistenceResult = function (resultsJson) {
    try {
        const results = JSON.parse(resultsJson);
        const list = loadRecentBooks();
        let changed = false;

        results.forEach(r => {
            const idx = list.findIndex(b => b.id === r.id);
            if (idx >= 0 && list[idx].unavailable !== !r.exists) {
                list[idx].unavailable = !r.exists;
                changed = true;
            }
        });

        if (changed) {
            saveRecentBooks(list);
        }

        if (document.getElementById('library-overlay').classList.contains('show')) {
            renderLibraryGrid();
        }
    } catch (err) {
        console.log('__onCheckExistenceResult failed:', err);
    }
};

function renderStatsList() {

        .slice()
        .sort((a, b) => (b.lastCompletedAt || b.lastOpenedAt || 0) - (a.lastCompletedAt || a.lastOpenedAt || 0));

function formatRelativeTime(ts) {
    const diffMs = Date.now() - ts;
    const diffMin = Math.round(diffMs / 60000);
    if (diffMin < 1) return '刚刚';
    if (diffMin < 60) return diffMin + ' 分钟前';
    const diffHour = Math.round(diffMin / 60);
    if (diffHour < 24) return diffHour + ' 小时前';
    const diffDay = Math.round(diffHour / 24);
    if (diffDay < 30) return diffDay + ' 天前';
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function handleCloseClick() {
            const isLastPage = currentIndex === pages.length - 1;

            if (isLastPage) {
                closeBook();
                return;
            }

            if (window.confirm('Are you sure you want to exit the current book?')) {
                closeBook();

}

function closeBook() {
            // 只有在最后一页关闭，才算"读完一次"，计入统计
            if (pages.length > 0 && currentIndex === pages.length - 1) {
                recordBookCompleted();
            }

            stopAudio();

            pages = [];
            currentIndex = 0;
            currentBookId = null;
            currentBookMeta = null;

            if (settingsModal.classList.contains('show')) {
                settingsModal.classList.remove('show');
            }

            viewport.style.display = 'none';
            uploadContainer.style.display = 'flex';

            if (!__isDisplayMode) {
                setTimeout(() => {
                    window.location.href = "app://display/close";
                }, 60);

}

function updateNavState() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === pages.length - 1;
}

function layoutImage() {
            if (!imgEl.naturalWidth || !imgEl.naturalHeight) {
                return;
            }

            const originalWidth = imgEl.naturalWidth;
            const originalHeight = imgEl.naturalHeight;

            const scale = Math.min(
                STAGE_WIDTH / originalWidth,
                STAGE_HEIGHT / originalHeight
            );

            const width = originalWidth * scale;
            const height = originalHeight * scale;

            imgEl.style.width = width + 'px';
            imgEl.style.height = height + 'px';
            imgEl.style.left = ((STAGE_WIDTH - width) / 2) + 'px';
            imgEl.style.top = ((STAGE_HEIGHT - height) / 2) + 'px';
}

function loadPage(index, notifyDisplay = true) {
            if (index < 0 || index >= pages.length) return;

            currentIndex = index;
            stopAudio();

            const page = pages[currentIndex];

            imgEl.onload = layoutImage;
            imgEl.src = page.image || '';

            updateNavState();
            renderSentenceButtons(page); // 旧版编号按钮：照常生成数据，只是整体被 CSS 隐藏了

            if (imgEl.complete) {
                layoutImage();
            }

            // 新一页先重置播放控件状态（还没选中任何一句）
            currentAudioIndex = -1;
            updateAudioControlsUI();

            // 展示模式(电视)上不自动播放音频，避免和主设备的声音重叠
            if (!__isDisplayMode && autoPlayFirstAudio && page.sentenceAudios && page.sentenceAudios.length > 0) {
                playAudioAt(0);
            }

            // 通知原生：翻页了，请把新的页码同步给外接屏(如果已连接)
            if (!__isDisplayMode && notifyDisplay) {
                setTimeout(() => {
                    window.location.href = "app://display/page/" + currentIndex;
                }, 30);
            }
}

function renderSentenceButtons(page) {
            btnContainer.innerHTML = '';

            if (!page.sentenceAudios || page.sentenceAudios.length === 0) {
                return;
            }

            const btnWidth = 60;
            const btnHeight = 48;
            const spacing = 8;

            const rightMargin = 15;
            const topMargin = 8;

            const navButtonHeight = 70;
            const nextBtnTop = (STAGE_HEIGHT - navButtonHeight) / 2;
            const nextBtnBottom = nextBtnTop + navButtonHeight;
            const skipGap = 8;

            const baseLeft = STAGE_WIDTH - rightMargin - btnWidth;

            const macaronColors = [
                'rgb(255,154,162)',
                'rgb(255,183,178)',
                'rgb(255,218,193)',
                'rgb(226,240,203)',
                'rgb(181,234,215)',
                'rgb(199,206,234)'
            ];

            page.sentenceAudios.forEach((audioUri, idx) => {
                const col = Math.floor(idx / 8);
                const row = idx % 8;

                const left = baseLeft - col * (btnWidth + spacing);

                let top;
                if (row < 4) {
                    top = topMargin + row * (btnHeight + spacing);
                } else {
                    top = nextBtnBottom + skipGap + (row - 4) * (btnHeight + spacing);
                }

                if (left < 10 || top + btnHeight > STAGE_HEIGHT - 10) {
                    return;
                }

                const btn = document.createElement('button');
                btn.className = 'audio-num-btn';
                btn.style.left = left + 'px';
                btn.style.top = top + 'px';
                btn.style.backgroundColor = macaronColors[idx % macaronColors.length];
                btn.textContent = String(idx + 1);

                btn.onclick = function(e) {
                    e.stopPropagation();
                    playSingleAudio(audioUri, btn);
                };

                btnContainer.appendChild(btn);
            });
}

function playSingleAudio(uri, btnEl) {
            stopAudio();

            if (!uri) return;

            if (btnEl) {
                currentPlayingBtn = btnEl;
                currentPlayingBtn.classList.add('playing');
            }

            audioEl.src = uri;
            audioEl.onended = function() {
                stopAudio();
            };

            audioEl.play().catch(err => {
                console.log('Playback restricted:', err);
            });
}

function stopAudio() {
            audioEl.pause();
            audioEl.removeAttribute('src');
            audioEl.load();
            audioEl.onended = null;

            if (currentPlayingBtn) {
                currentPlayingBtn.classList.remove('playing');
                currentPlayingBtn = null;
            }

            if (audioPlayBtn) {
                audioPlayBtn.classList.remove('playing');
            }
}

// ==================== 新版播放控件：上一句 / 播放当前 / 下一句 + 倍速 ====================
const SPEED_STEPS = [1, 1.1, 1.2, 1.3]; // 仅作为"目前支持哪几档"的参考，弹出选择条里是分别写死的按钮
let currentAudioIndex = -1;
let currentPlaybackRate = 1;

// 注意：倍速现在只在"打开一本书"的那一刻重置为 1x(在 parseAndOpenBook 里做)，
// 同一本书内不管翻页还是切换到别的句子，倍速都不会被自动改动。

function currentSentenceAudios() {
            const page = pages[currentIndex];
            return (page && page.sentenceAudios) ? page.sentenceAudios : [];
}

function formatSpeedLabel(rate) {
            return rate.toFixed(1).replace(/\.0$/, '') + 'x';
}

function updateAudioControlsUI() {
            const list = currentSentenceAudios();
            const total = list.length;

            audioControls.style.display = total > 0 ? 'flex' : 'none';
            if (total === 0) return;

            audioCounterEl.textContent = (currentAudioIndex + 1) + ' / ' + total;
            audioPrevBtn.disabled = currentAudioIndex <= 0;
            audioNextBtn.disabled = currentAudioIndex >= total - 1;
            audioSpeedBtn.textContent = formatSpeedLabel(currentPlaybackRate);

            // 同步高亮速度选择条里当前选中的那一档
            document.querySelectorAll('.speed-option').forEach(btn => {
                const rate = parseFloat(btn.textContent);
                btn.classList.toggle('active', Math.abs(rate - currentPlaybackRate) < 0.001);
            });
}

function playAudioAt(index) {
            const list = currentSentenceAudios();
            if (index < 0 || index >= list.length) return;

            currentAudioIndex = index;
            updateAudioControlsUI();
            playSentenceAudio(list[index]);
}

function playSentenceAudio(uri) {
            stopAudio();

            if (!uri) return;

            audioEl.src = uri;
            audioEl.playbackRate = currentPlaybackRate;

            // 有些机型切换 src 后倍速会被重置，metadata 加载完再保险地设一次
            audioEl.onloadedmetadata = function () {
                audioEl.playbackRate = currentPlaybackRate;
            };

            audioEl.onended = function () {
                audioPlayBtn.classList.remove('playing');
            };

            audioPlayBtn.classList.add('playing');

            audioEl.play().catch(err => {
                console.log('Playback restricted:', err);
            });
}

function handleAudioPrev() {
            if (currentAudioIndex > 0) {
                playAudioAt(currentAudioIndex - 1);
            }
}

function handleAudioNext() {
            if (currentAudioIndex < currentSentenceAudios().length - 1) {
                playAudioAt(currentAudioIndex + 1);
            }
}

function handleAudioReplay() {
            if (currentAudioIndex >= 0) {
                playAudioAt(currentAudioIndex);
            }
}

}

// ==================== 左右滑动翻页 ====================
// 屏幕上左右滑动即可翻页；在最后一页再向左滑（相当于"翻到下一页"）时，
// 直接关闭电子书，不弹确认框（和点击右上角关闭按钮的行为不同）。
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

const SWIPE_MIN_DISTANCE = 50;   // 触发翻页所需的最小水平滑动距离(px)
const SWIPE_MAX_DURATION = 600;  // 超过这个时长(ms)就不当作"滑动手势"了
const SWIPE_MAX_VERTICAL = 60;   // 纵向偏移超过这个值，判定为上下滚动而不是翻页

function isInteractiveSwipeTarget(target) {
            return !!(target && target.closest && target.closest(
                '.nav-btn, #back-btn, #settings-btn, #settings-modal, .audio-num-btn, #audio-controls'
            ));
}

viewport.addEventListener('touchstart', (e) => {
            if (__isDisplayMode || !pages.length || e.touches.length !== 1) return;
            if (isInteractiveSwipeTarget(e.target)) return;

            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchStartTime = Date.now();
}, { passive: true });

viewport.addEventListener('touchend', (e) => {
            if (__isDisplayMode || !pages.length || !touchStartTime) return;
            if (isInteractiveSwipeTarget(e.target)) {
                touchStartTime = 0;
                return;
            }

            const t = e.changedTouches[0];
            const deltaX = t.clientX - touchStartX;
            const deltaY = t.clientY - touchStartY;
            const duration = Date.now() - touchStartTime;
            touchStartTime = 0;

            if (duration > SWIPE_MAX_DURATION) return;
            if (Math.abs(deltaY) > SWIPE_MAX_VERTICAL) return;
            if (Math.abs(deltaX) < SWIPE_MIN_DISTANCE) return;

            if (deltaX < 0) {
                // 向左滑：下一页；已经是最后一页的话直接关闭，不提醒
                if (currentIndex < pages.length - 1) {
                    nextPage();
                } else {
                    closeBook();
                }
            } else {
                // 向右滑：上一页
                if (currentIndex > 0) {
                    prevPage();
                }
            }
}, { passive: true });
// ==========================================================

// ==================== 供原生调用的展示模式接口 ====================
// 原生层(ExternalDisplayManager)在外接屏的 WKWebView 加载完这份网页后，
// 会调用下面两个函数，把主屏当前的书本数据 / 当前页码同步过来。
// 这两个函数只在 ?mode=display 的实例里有意义。

window.__loadBookFromNative = function (pagesJson) {
    try {
        pages = JSON.parse(pagesJson);
        if (!pages || pages.length === 0) return;

        uploadContainer.style.display = 'none';
        viewport.style.display = 'block';
        resizeStage();
    } catch (err) {
        console.error('__loadBookFromNative failed:', err);
    }
};

window.__showPageFromNative = function (index) {
    if (!pages || pages.length === 0) return;
    loadPage(index);
};

window.__closeBookFromNative = function () {
    stopAudio();
    pages = [];
    currentIndex = 0;
    viewport.style.display = 'none';
    // 展示模式下 upload-container 本来就被 CSS 强制隐藏，这里保持黑屏即可
};
// ====================================================================
    </script>
