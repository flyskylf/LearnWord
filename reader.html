<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reader">
    <title>Reader</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #000;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* File Upload Interface */
        #upload-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: #1c1c1e;
            text-align: center;
        }

        .upload-card {
            border: 2px dashed #444;
            border-radius: 24px;
            padding: 40px 30px;
            width: 85%;
            max-width: 420px;
            background: rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .upload-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .upload-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .upload-subtitle {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-select {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        #viewport {
            position: fixed;
            inset: 0;
            display: none;
            overflow: hidden;
            background: #000;
        }

        :root {
            --stage-width: 960px;
            --stage-height: 540px;
        }

        #stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--stage-width);
            height: var(--stage-height);
            transform-origin: center center;
            background: #fff;
            overflow: hidden;
        }

        #book-img {
            position: absolute;
            display: block;
            border: 0;
            outline: 0;
            max-width: none;
            max-height: none;
        }

        .nav-btn {
            position: absolute;
            width: 60px;
            height: 70px;
            padding: 0;
            margin: 0;
            background: rgba(120,120,120,.65);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 32px;
            font-weight: 700;
            line-height: 70px;
            text-align: center;
            z-index: 200;
            cursor: pointer;
        }

        #prev-btn {
            left: 15px;
            top: 235px; /* (540 - 70) / 2 */
        }

        #next-btn {
            right: 15px;
            top: 235px;
        }

        .nav-btn:disabled {
            display: none;
        }

        /* Top-left Back Button */
        #back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            padding: 0;
            margin: 0;
            background: rgba(0,0,0,.25);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 20px;
            z-index: 300;
            cursor: pointer;
        }

        /* Bottom-left Setting Button */
        #settings-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 44px;
            height: 44px;
            padding: 0;
            margin: 0;
            background: rgba(0,0,0,.35);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 22px;
            z-index: 300;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            #settings-btn:active {
                transform: scale(0.95);
            }

        /* Settings Modal */
        #settings-modal {
            display: none;
            position: absolute;
            bottom: 68px;
            left: 15px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 400;
            min-width: 220px;
            border: 1px solid rgba(255,255,255,0.15);
        }

            #settings-modal.show {
                display: block;
            }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            user-select: none;
            cursor: pointer;
            gap: 12px;
        }

            .setting-item input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #0a84ff;
                cursor: pointer;
            }

        /* Sentence Audio Buttons */
        .audio-num-btn {
            position: absolute;
            width: 60px;
            height: 48px;
            padding: 0;
            margin: 0;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid #fff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            cursor: pointer;
            box-shadow: 1px 2px 3px rgba(0,0,0,.5);
        }

            .audio-num-btn:active {
                transform: scale(.96);
            }

            .audio-num-btn.playing {
                filter: brightness(.85);
                border-color: #fef08a;
            }

        #audio-player {
            display: none;
        }

        /*
         * 外接屏"展示模式" (?mode=display)：
         * 只保留内容画面本身，把上传界面、翻页按钮、设置、返回、句子音频按钮全部隐藏，
         * 因为电视屏幕不可触摸，这些控件在这份拷贝上没有意义。
         */
        html.display-mode #upload-container,
        html.display-mode #back-btn,
        html.display-mode #settings-btn,
        html.display-mode #settings-modal,
        html.display-mode .nav-btn,
        html.display-mode #audio-buttons-container {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="upload-container">
        <div class="upload-card" onclick="document.getElementById('file-input').click()">
            <div class="upload-icon">📖</div>
            <div class="upload-title">Open File</div>
            <div class="upload-subtitle">Please select a file</div>
            <button class="btn-select">Select File</button>
        </div>
        <input id="file-input" type="file" accept=".html,.htm"
               style="display:none" onchange="loadBookFile(this.files[0])">
    </div>

    <div id="viewport">
        <div id="stage">

            <button id="back-btn" onclick="handleCloseClick()" aria-label="Back">✕</button>

            <!-- Bottom-left Setting Button & Modal -->
            <button id="settings-btn" onclick="toggleSettingsModal(event)" aria-label="Settings">⚙️</button>
            <div id="settings-modal" onclick="event.stopPropagation()">
                <label class="setting-item">
                    <span>Auto-play first audio</span>
                    <input type="checkbox" id="auto-play-toggle" onchange="handleAutoPlayChange(this.checked)">
                </label>
            </div>

            <img id="book-img" src="" alt="Slide">

            <button id="prev-btn" class="nav-btn" onclick="prevPage()" aria-label="Previous">‹</button>
            <button id="next-btn" class="nav-btn" onclick="nextPage()" aria-label="Next">›</button>

            <div id="audio-buttons-container"></div>

            <audio id="audio-player"></audio>
        </div>
    </div>

    <script>
const STAGE_WIDTH = 960;
const STAGE_HEIGHT = 540;

// ==================== 外接屏展示模式 ====================
// 通过 URL 参数 ?mode=display 区分：这份网页实例是加载在电视(外接屏)上的"只读镜像"，
// 还是加载在 iPad/iPhone 本机屏幕上的"可交互"主实例。
const __isDisplayMode = new URLSearchParams(window.location.search).get('mode') === 'display';
if (__isDisplayMode) {
    document.documentElement.classList.add('display-mode');
}
// ==========================================================

let pages = [];
let currentIndex = 0;
let currentPlayingBtn = null;

// Default to auto-play first audio unless explicitly turned off
let autoPlayFirstAudio = localStorage.getItem('autoPlayFirstAudio') !== 'false';

const uploadContainer = document.getElementById('upload-container');
const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
const imgEl = document.getElementById('book-img');
const audioEl = document.getElementById('audio-player');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const btnContainer = document.getElementById('audio-buttons-container');
const settingsModal = document.getElementById('settings-modal');
const autoPlayToggle = document.getElementById('auto-play-toggle');

// Initialize checkbox state
autoPlayToggle.checked = autoPlayFirstAudio;

function resizeStage() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            const scale = Math.min(
                vw / STAGE_WIDTH,
                vh / STAGE_HEIGHT
            );

            stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener('resize', resizeStage);
window.addEventListener('orientationchange', () => {
            setTimeout(resizeStage, 100);
});

// Close settings modal when clicking outside
stage.addEventListener('click', (e) => {
            if (settingsModal.classList.contains('show')) {
                settingsModal.classList.remove('show');
            }
});

function toggleSettingsModal(e) {
            e.stopPropagation();
            settingsModal.classList.toggle('show');
}

function handleAutoPlayChange(checked) {
            autoPlayFirstAudio = checked;
            localStorage.setItem('autoPlayFirstAudio', checked ? 'true' : 'false');
}

function loadBookFile(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
        const htmlContent = e.target.result;

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlContent, 'text/html');
        const dataScript = doc.getElementById('book-data');

        if (!dataScript) {
            alert('Invalid file format! "book-data" element not found.');
            return;
        }

        try {
            pages = JSON.parse(dataScript.textContent);

            if (!pages || pages.length === 0) {
                return;
            }

            // ==================== 特殊处理首图重复问题 ====================
            // 如果第一页图片为空，尝试从 DOM 中的 #cover-image 或第一个 <img> 提取封面 src
            if (!pages[0].image) {
                const coverImgEl = doc.getElementById('cover-image') || doc.querySelector('img');
                if (coverImgEl) {
                    pages[0].image = coverImgEl.getAttribute('src') || '';
                }
            }
            // ==============================================================

            uploadContainer.style.display = 'none';
            viewport.style.display = 'block';

            // 注意：不要在同一个 JS 同步任务里连续多次给 location.href 赋值——
            // 浏览器/WKWebView 只会真正处理"最后一次"赋值，前面几次会被静默打断，
            // 之前横屏失效就是因为这里紧接着又赋值了一次 app://display/loadbook，
            // 把 app://orientation/landscape 这条命令给顶掉了。
            window.location.href = "app://orientation/landscape";

            resizeStage();

            // Unlock audio on iOS
            audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
            audioEl.play().catch(() => { });

            // 首次加载页面时不单独触发"翻页同步"通知，避免它再和下面的 loadbook 通知互相覆盖，
            // 外接屏那边会通过 loadbook 通知一次性拿到 pages + 当前页码。
            loadPage(0, false);

            // 通知原生：书已经加载好了，请把 pages 数据同步给外接屏(如果已连接)。
            // 用 setTimeout 错开到下一个宏任务，确保上面的横屏命令已经被原生处理掉，不会被这条覆盖。
            if (!__isDisplayMode) {
                setTimeout(() => {
                    window.location.href = "app://display/loadbook";
                }, 60);
            }

        } catch (err) {
            alert('Failed to parse data: ' + err.message);
        }
    };

    reader.readAsText(file);
}

function handleCloseClick() {
            const isLastPage = currentIndex === pages.length - 1;

            if (isLastPage) {
                closeBook();
                return;
            }

            if (window.confirm('Are you sure you want to exit the current book?')) {
                closeBook();
            }
}

function closeBook() {
            stopAudio();

            pages = [];
            currentIndex = 0;

            if (settingsModal.classList.contains('show')) {
                settingsModal.classList.remove('show');
            }

            viewport.style.display = 'none';
            uploadContainer.style.display = 'flex';

            document.getElementById('file-input').value = '';

            window.location.href = "app://orientation/portrait";

            // 通知原生：书关闭了，外接屏也应该清空。同样错开一个宏任务，避免覆盖上面的竖屏命令。
            if (!__isDisplayMode) {
                setTimeout(() => {
                    window.location.href = "app://display/close";
                }, 60);
            }
}

function updateNavState() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === pages.length - 1;
}

function layoutImage() {
            if (!imgEl.naturalWidth || !imgEl.naturalHeight) {
                return;
            }

            const originalWidth = imgEl.naturalWidth;
            const originalHeight = imgEl.naturalHeight;

            const scale = Math.min(
                STAGE_WIDTH / originalWidth,
                STAGE_HEIGHT / originalHeight
            );

            const width = originalWidth * scale;
            const height = originalHeight * scale;

            imgEl.style.width = width + 'px';
            imgEl.style.height = height + 'px';
            imgEl.style.left = ((STAGE_WIDTH - width) / 2) + 'px';
            imgEl.style.top = ((STAGE_HEIGHT - height) / 2) + 'px';
}

function loadPage(index, notifyDisplay = true) {
            if (index < 0 || index >= pages.length) return;

            currentIndex = index;
            stopAudio();

            const page = pages[currentIndex];

            imgEl.onload = layoutImage;
            imgEl.src = page.image || '';

            updateNavState();
            renderSentenceButtons(page);

            if (imgEl.complete) {
                layoutImage();
            }

            // 展示模式(电视)上不自动播放音频，避免和主设备的声音重叠
            if (!__isDisplayMode && autoPlayFirstAudio && page.sentenceAudios && page.sentenceAudios.length > 0) {
                const firstBtn = btnContainer.querySelector('.audio-num-btn');
                playSingleAudio(page.sentenceAudios[0], firstBtn);
            }

            // 通知原生：翻页了，请把新的页码同步给外接屏(如果已连接)
            if (!__isDisplayMode && notifyDisplay) {
                setTimeout(() => {
                    window.location.href = "app://display/page/" + currentIndex;
                }, 30);
            }
}

function renderSentenceButtons(page) {
            btnContainer.innerHTML = '';

            if (!page.sentenceAudios || page.sentenceAudios.length === 0) {
                return;
            }

            const btnWidth = 60;
            const btnHeight = 48;
            const spacing = 8;

            const rightMargin = 15;
            const topMargin = 8;

            const navButtonHeight = 70;
            const nextBtnTop = (STAGE_HEIGHT - navButtonHeight) / 2;
            const nextBtnBottom = nextBtnTop + navButtonHeight;
            const skipGap = 8;

            const baseLeft = STAGE_WIDTH - rightMargin - btnWidth;

            const macaronColors = [
                'rgb(255,154,162)',
                'rgb(255,183,178)',
                'rgb(255,218,193)',
                'rgb(226,240,203)',
                'rgb(181,234,215)',
                'rgb(199,206,234)'
            ];

            page.sentenceAudios.forEach((audioUri, idx) => {
                const col = Math.floor(idx / 8);
                const row = idx % 8;

                const left = baseLeft - col * (btnWidth + spacing);

                let top;
                if (row < 4) {
                    top = topMargin + row * (btnHeight + spacing);
                } else {
                    top = nextBtnBottom + skipGap + (row - 4) * (btnHeight + spacing);
                }

                if (left < 10 || top + btnHeight > STAGE_HEIGHT - 10) {
                    return;
                }

                const btn = document.createElement('button');
                btn.className = 'audio-num-btn';
                btn.style.left = left + 'px';
                btn.style.top = top + 'px';
                btn.style.backgroundColor = macaronColors[idx % macaronColors.length];
                btn.textContent = String(idx + 1);

                btn.onclick = function(e) {
                    e.stopPropagation();
                    playSingleAudio(audioUri, btn);
                };

                btnContainer.appendChild(btn);
            });
}

function playSingleAudio(uri, btnEl) {
            stopAudio();

            if (!uri) return;

            if (btnEl) {
                currentPlayingBtn = btnEl;
                currentPlayingBtn.classList.add('playing');
            }

            audioEl.src = uri;
            audioEl.onended = function() {
                stopAudio();
            };

            audioEl.play().catch(err => {
                console.log('Playback restricted:', err);
            });
}

function stopAudio() {
            audioEl.pause();
            audioEl.removeAttribute('src');
            audioEl.load();
            audioEl.onended = null;

            if (currentPlayingBtn) {
                currentPlayingBtn.classList.remove('playing');
                currentPlayingBtn = null;
            }
}

function nextPage() {
            if (currentIndex < pages.length - 1) {
                loadPage(currentIndex + 1);
            }
}

function prevPage() {
            if (currentIndex > 0) {
                loadPage(currentIndex - 1);
            }
}

document.addEventListener('keydown', function(e) {
            if (viewport.style.display === 'block') {
                if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                    nextPage();
                }

                if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    prevPage();
                }

                if (e.key === 'Escape') {
                    handleCloseClick();
                }
            }
});

// ==================== 供原生调用的展示模式接口 ====================
// 原生层(ExternalDisplayManager)在外接屏的 WKWebView 加载完这份网页后，
// 会调用下面两个函数，把主屏当前的书本数据 / 当前页码同步过来。
// 这两个函数只在 ?mode=display 的实例里有意义。

window.__loadBookFromNative = function (pagesJson) {
    try {
        pages = JSON.parse(pagesJson);
        if (!pages || pages.length === 0) return;

        uploadContainer.style.display = 'none';
        viewport.style.display = 'block';
        resizeStage();
    } catch (err) {
        console.error('__loadBookFromNative failed:', err);
    }
};

window.__showPageFromNative = function (index) {
    if (!pages || pages.length === 0) return;
    loadPage(index);
};

window.__closeBookFromNative = function () {
    stopAudio();
    pages = [];
    currentIndex = 0;
    viewport.style.display = 'none';
    // 展示模式下 upload-container 本来就被 CSS 强制隐藏，这里保持黑屏即可
};
// ====================================================================
    </script>

</body>
</html>
